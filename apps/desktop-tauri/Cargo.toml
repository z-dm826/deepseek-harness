[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness Desktop App with Proxy Manager"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
dirs = "5.0"
